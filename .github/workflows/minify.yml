name: Minify
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: HTML/CSS/JS Minifier
        uses: devatherock/minify-js@v3.0.0
        with:
          add_suffix: false

      - name: Push to minify Branch
        uses: devops-infra/action-commit-push@v1.1.0
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          commit_message: "ci: minify files"
          force: true
          target_branch: minify
